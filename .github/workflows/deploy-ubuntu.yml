name: Deploy Ubuntu Server

on:

  workflow_dispatch:

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar SSH
        run: |

          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H 192.168.1.13 >> ~/.ssh/known_hosts

      - name: Conexion al servidor
        run: |

          ssh hrojas1@192.168.1.13 "

            echo '======================='
            echo 'DEPLOY DESDE GITHUB'
            echo '======================='

            echo 'Servidor:'
            hostname

            echo 'Usuario:'
            whoami

            echo 'Fecha:'
            date

            echo 'Directorio actual:'
            pwd

          "